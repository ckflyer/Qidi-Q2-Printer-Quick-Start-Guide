#---------------------# My Custom Macros and Configs #---------------------#
#
# Create this file in Fluidd (Configuration > + > New file) in the main
# directory, then add this line near the top of printer.cfg:
#
#     [include My_Configs.cfg]
#
# Then paste in whichever of these you want, from the Resources folder:
#   - PRINT_START.cfg    (comment out the stock PRINT_START in gcode_macro.cfg first)
#   - SPEED_TEST.cfg
#   - ORCA_QIDI_BOX.cfg  (only if you use Orca Slicer with the Qidi Box)
#
# Tip: comment anything you change, so it's easy to compare after a
# firmware update.
#--------------------------------------------------------------------------#

# Show toolhead and host CPU temps in Fluidd
[temperature_sensor Host_CPU]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor toolhead]
sensor_type: temperature_mcu
sensor_mcu: THR
min_temp: 0
max_temp: 100
